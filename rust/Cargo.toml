[package]
name = "appcsxcad"
version = "0.1.0"
edition = "2021"
license = "GPL-3.0-or-later"
description = "AppCSXCAD: egui-based GUI application for CSXCAD geometry viewing and editing"

[[bin]]
name = "appcsxcad"
path = "src/main.rs"

[dependencies]
png = "0.17"
qcsxcad-egui = { path = "../../QCSXCAD/rust-egui", features = ["docking"] }
qcsxcad-core = { path = "../../QCSXCAD/rust" }
csxcad-core = { path = "../../CSXCAD/rust" }
egui = { version = "0.37", features = ["default_fonts"] }
egui-winit = "0.37"
egui-wgpu = "0.37"
wgpu = "30"
winit = "0.30"
bytemuck = { version = "1.14", features = ["derive"] }
thiserror = "2.0"
directories = "5.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
env_logger = "0.11"
log = "0.4"
pollster = "0.3"